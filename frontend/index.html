<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/shield-alert.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="IncidentZero" />
    <meta name="apple-mobile-web-app-title" content="IncidentZero" />
    <meta name="description" content="A high-stakes tycoon simulation of SRE crisis management, real-time incident response, and IT governance in a retro pixel art cyber war room." />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IncidentZero" />
    <meta property="og:title" content="IncidentZero | SRE Crisis Simulator" />
    <meta property="og:description" content="Manage outages, survive regulatory audits, and steer your engineering team in a real-time tactical cyber war room." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IncidentZero: an isometric pixel-art SRE war room under a live incident" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IncidentZero | SRE Crisis Simulator" />
    <meta name="twitter:description" content="Manage outages, survive regulatory audits, and steer your engineering team in a real-time tactical cyber war room." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="IncidentZero: an isometric pixel-art SRE war room under a live incident" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>IncidentZero | SRE Crisis Simulator</title>
    <script>
      // set the document language before first paint (App keeps it in sync afterwards)
      try {
        var l = localStorage.getItem("incidentzero.language");
        if (l) document.documentElement.lang = l;
        else if (/^pt/i.test(navigator.language)) document.documentElement.lang = "pt-BR";
        else if (/^es/i.test(navigator.language)) document.documentElement.lang = "es";
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-200 overflow-hidden font-sans" style="background:#020617;margin:0">
    <!-- first-paint splash: shown while the active language's dictionary chunk loads, replaced by React -->
    <div id="root">
      <div
        aria-hidden="true"
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020617;color:#22d3ee;font:700 14px/1 system-ui,sans-serif;letter-spacing:.35em;text-transform:uppercase;opacity:.8"
      >
        IncidentZero
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
