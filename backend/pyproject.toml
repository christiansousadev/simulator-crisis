[project]
name = "incidentzero-backend"
version = "1.0.0"
description = "IncidentZero: SRE & IT Governance Crisis Simulator - FastAPI backend"
requires-python = ">=3.11"

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# a conservative, high-signal set: real bugs (F, B) and import hygiene (I, E/W style errors),
# not a full opinionated rewrite of an already-consistent, comment-dense codebase
select = ["E", "F", "W", "I", "B"]
ignore = [
  "E501", # line length is black's job (line-length above matches black's setting anyway)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
