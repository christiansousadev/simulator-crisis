name: CI

# runs the backend pytest suite and the frontend typecheck/test/build pipeline on every push
# and pull request, so a schema-drift or type regression is caught before it reaches a running
# instance -- exactly the class of bug ("no such column", a stale WS payload shape) that has
# previously only surfaced by hand, after the fact, against a real running server. Lint (ruff /
# eslint) and coverage run alongside the tests they annotate rather than as separate jobs, so a
# lint or coverage regression fails the same check a reviewer is already looking at.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# a newer push to the same ref supersedes the run still in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run test suite (with coverage)
        run: python -m pytest tests/ -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (eslint, typecheck, unit tests + coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests (with coverage)
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, real backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        # playwright.config.ts's webServer entries start both the backend (uvicorn) and frontend
        # (vite dev) themselves in CI (reuseExistingServer is only true outside CI)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
